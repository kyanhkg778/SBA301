spring.application.name=A3LamDangKyAnh_SE1910
server.port=8080

# Cấu hình MS SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3LamDangKyAnh_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate: Giữ nguyên tên bảng/cột theo Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Tài khoản Staff lấy từ application.properties theo đề bài
hotel.staff.email=staff@fuminihotel.com
hotel.staff.password=staff123
hotel.staff.name=Staff Administrator

# Cấu hình JWT
hotel.jwt.secret=9a3f8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a
hotel.jwt.expiration-ms=86400000

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.sba301.fuminihotel=DEBUG
